description = "There's got to be an easier way. Drop the task, go back to first principles, find the pencil — or say honestly there isn't one. (Alias: /pencil)"
prompt = "The user said russianpencil. That is a keyword meaning: THERE'S GOT TO BE AN EASIER WAY — go back to first principles and stop worrying about the very specific task in front of us. Load the russianpencil skill and change altitude. Follow the move: (1) put the current task down and name what we were grinding on; (2) go up one level and state what we are ACTUALLY trying to achieve in one sentence with NO solution nouns in it — if you cannot say it without naming the thing we were already building, you are still in the cage, go up again; this step IS the skill; (3) from up there, enumerate at least three ways to reach that goal — mechanisms, not products — one of which must be 'don't do it at all', argued seriously; (4) is one stupidly, obviously easier? not 20% easier, that's noise — easier like graphite vs a pressurized ink cartridge; (5) if none is, say NO PENCIL plainly — 'it's hard because it's hard' is a real and common answer; (6) before recommending the easy way, confirm it actually exists and does the job, because satisfying and true feel identical from the inside; (7) name what the easy way costs you and when it breaks. Output the reframed goal, the ways you saw, and one verdict: PENCIL or NO PENCIL. Both are successes. Manufacturing a pencil to be agreeable is the only real failure. Target: $ARGUMENTS"
