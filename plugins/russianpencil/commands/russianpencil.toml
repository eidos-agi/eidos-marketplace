description = "Whoa, this looks complicated — find the pencil. Prices the obvious path against the cheaper solution classes. (Alias: /pencil)"
prompt = "The user just hit a 'whoa, wtf, this must be complicated' moment and reached for RussianPencil. Load the russianpencil skill and run the descent on the target below — or, if nothing follows, on whatever is currently in front of us in this conversation. Follow the skill exactly: (0) name what looks heavy; (1) strip the requirement to one sentence with no solution nouns in it; (2) price the obvious path with a real number, ignoring sunk cost, and stop early if the number is small; (3) enumerate at least three solution CLASSES — mechanisms, not products — including the null class argued seriously; (4) price each to one order of magnitude; (5) apply the 10x rule and let it fail; (6) name the ceiling the cheap class buys and when it breaks; (7) verify the cheap class exists against a primary source before recommending it. Output the class table and exactly one verdict: PENCIL, NO PENCIL, or PENCIL-DON'T-SWITCH. The flinch that triggered this is not evidence — all three verdicts are successes, and manufacturing a pencil to be agreeable is the one real failure. Target: $ARGUMENTS"
