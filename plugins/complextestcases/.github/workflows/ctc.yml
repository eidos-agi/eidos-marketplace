name: ctc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ctc:
    name: ctc suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ctc suite
        run: python3 tools/ctc.py status ctc
